<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Journal</title>
<style>
:root{
  --bg:#0b0d10; --panel:#13171c; --panel2:#1a1f26; --line:#262d36; --text:#e6e9ee; --muted:#8b95a3;
  --green:#22c55e; --green-bg:rgba(34,197,94,.14); --red:#ef4444; --red-bg:rgba(239,68,68,.14);
  --gold:#f5b62b; --blue:#3b82f6; --accent:#3b82f6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:#0e1115;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header h1 span{color:var(--muted);font-weight:500}
nav{display:flex;gap:4px;margin-left:8px}
nav button{background:none;border:1px solid transparent;border-radius:8px;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:600}
nav button.on{background:var(--panel2);border-color:var(--line);color:var(--text)}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
main{padding:20px;max-width:1400px;margin:0 auto}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#3a4450}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:transparent;border-color:#5b2323;color:#ff8a8a}
.btn.sm{padding:4px 10px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .lab{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--muted)}
h2{font-size:15px;margin:0 0 12px;font-weight:700}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--panel)}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.pill.win{background:var(--green-bg);color:var(--green);border-color:transparent}
.pill.loss{background:var(--red-bg);color:var(--red);border-color:transparent}
.pill.be{color:var(--muted)}
.pill.warn{background:rgba(245,182,43,.14);color:var(--gold);border-color:transparent}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar select,.toolbar input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.15);color:#9cc1ff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip button{background:none;border:0;color:inherit;cursor:pointer;font-size:15px;padding:0}
.notes-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-head .title{font-size:18px;font-weight:700;min-width:170px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 120px;gap:6px}
.cal .dow{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;padding:0 6px}
.day{min-height:92px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;cursor:default}
.day.other{opacity:.35}
.day.has{cursor:pointer}
.day.has:hover{border-color:#4a5563}
.day.win{background:linear-gradient(0deg,var(--green-bg),var(--green-bg)),var(--panel);border-color:rgba(34,197,94,.35)}
.day.loss{background:linear-gradient(0deg,var(--red-bg),var(--red-bg)),var(--panel);border-color:rgba(239,68,68,.35)}
.day.today .dn{color:var(--accent);font-weight:700}
.day .dn{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.ddot{width:9px;height:9px;border-radius:3px;display:inline-block}
/* discipline heatmap */
.hm-wrap{overflow-x:auto;padding-bottom:6px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:16px repeat(7,15px);gap:3px;width:max-content}
.hm .c{width:15px;height:15px;border-radius:3px;cursor:pointer;outline-offset:1px}
.hm .c:hover{outline:1px solid #8b95a3}
.hm .c.out{visibility:hidden}
.hm .c.today{outline:1px solid var(--accent)}
.hm .ml{font-size:11px;color:var(--muted);white-space:nowrap;height:16px;line-height:16px}
.hm-dows{display:grid;grid-template-rows:16px repeat(7,15px);gap:3px;margin-right:6px;font-size:10px;color:var(--muted)}
.hm-legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:10px}
.hm-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.st-none,.hm .c.st-none{background:#1b2028}.st-auto,.hm .c.st-auto{background:#0e4429}.st-ok,.hm .c.st-ok{background:#26a641}.st-clean,.hm .c.st-clean{background:#39d353}.st-bad,.hm .c.st-bad{background:#da3633}
.rule-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel2);cursor:pointer}
.rule-row input{width:18px;height:18px;margin-top:2px}
.viol{color:#ff8a8a;font-size:13px}
/* edge / behavior */
.status-chip{border-radius:999px;font-weight:800;font-size:12px;padding:5px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel2)}
.status-chip.keep{color:#3ddc84;border-color:rgba(34,197,94,.45)}
.status-chip.caution{color:var(--gold);border-color:rgba(245,182,43,.5)}
.status-chip.stop{color:#ff6b6b;border-color:rgba(239,68,68,.6);background:rgba(239,68,68,.12)}
.status-chip.na{color:var(--muted)}
.banner{border-radius:12px;padding:16px 18px;border:1px solid var(--line);margin-bottom:14px}
.banner.keep{background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.4)}
.banner.caution{background:rgba(245,182,43,.10);border-color:rgba(245,182,43,.45)}
.banner.stop{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.55)}
.banner .big{font-size:22px;font-weight:800}
.matrix{display:grid;grid-template-columns:110px 1fr 1fr;gap:6px;font-size:13px}
.matrix div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.matrix .hd{background:none;border:0;color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;padding:4px}
.matrix .on{outline:2px solid var(--accent);background:rgba(59,130,246,.12)}
.exseg{display:flex;gap:4px}
.exseg button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer;font-weight:700;font-size:13px;min-width:34px}
.exseg button.on.y{background:#15803d;border-color:#15803d;color:#fff}
.exseg button.on.n{background:#b91c1c;border-color:#b91c1c;color:#fff}
.exrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.exrow .cat{color:var(--muted);font-size:12px}
.score{display:inline-block;min-width:38px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:800;font-size:12px}
.score.g{background:var(--green-bg);color:var(--green)}.score.m{background:rgba(245,182,43,.14);color:var(--gold)}.score.b{background:var(--red-bg);color:var(--red)}
.day .pnl{font-size:16px;font-weight:700;margin-top:auto}
.day .sub{font-size:12px;color:var(--muted)}
.week{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;justify-content:center}
.week .lab{font-size:11px;color:var(--muted);text-transform:uppercase}
.week .pnl{font-size:15px;font-weight:700}
.month-sum{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.month-sum div span{display:block;color:var(--muted);font-size:12px}
.month-sum div b{font-size:17px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);padding:20px}
.modal .row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:12px}
.modal .row label{color:var(--muted);font-weight:600;font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button.on.g{background:#15803d;border-color:#15803d}
.seg button.on.r{background:#b91c1c;border-color:#b91c1c}
.modal input[type=text],.modal input[type=number],.modal input[type=date],.modal input[type=time],.modal textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.modal textarea{min-height:80px;resize:vertical}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;background:var(--panel2);border-radius:10px;padding:12px;margin-bottom:16px}
.facts div span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}
.facts div b{font-size:15px}
.drop{border:1.5px dashed #3a4450;border-radius:10px;padding:14px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--text)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs .t{position:relative}
.thumbs img{height:90px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.thumbs .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);border:0;border-radius:6px;color:#fff;cursor:pointer;padding:0 6px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:30;cursor:zoom-out}
.viewer img{max-width:96vw;max-height:94vh}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.two{grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr))}
.card{min-width:0;overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%}
.verdict{font-size:18px;font-weight:700;margin:4px 0 6px}
.hint{color:var(--muted);font-size:13px}
.importbox{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
ol.steps{margin:6px 0 0 18px;padding:0;color:var(--muted)}
ol.steps li{margin:3px 0}
ol.steps b{color:var(--text)}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.settings-grid label{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:4px}
.settings-grid input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
svg text{fill:var(--muted);font-size:11px}
.acct-sel{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;max-width:240px}
.acct-tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.acct-tag.Prop{background:rgba(168,85,247,.18);color:#c9a2ff}.acct-tag.Practice{background:rgba(59,130,246,.15);color:#9cc1ff}.acct-tag.Live{background:var(--green-bg);color:var(--green)}
.prop{margin-bottom:14px}
.prop .rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:8px}
.prop .bar{height:10px;margin:6px 0 4px}
.prop .status{font-weight:800;font-size:15px}
.acct-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.acct-card .settings-grid input,.acct-card .settings-grid select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
@media (max-width:760px){
  main{padding:12px}
  .cal{grid-template-columns:repeat(7,1fr)}
  .cal .weekcol{display:none}
  .day{min-height:64px;padding:5px}
  .day .pnl{font-size:12px}
  .day .sub{display:none}
  .modal .row{grid-template-columns:1fr}
  header{gap:8px;padding:10px 12px}
  nav{order:3;width:100%;margin-left:0;overflow-x:auto}
  nav button{padding:6px 10px}
}
</style>
</head>
<body>
<header>
  <a class="btn sm" href="index.html" style="text-decoration:none">← Home</a>
  <h1>Trade Journal <span id="hdrSub"></span></h1>
  <nav id="nav">
    <button data-v="calendar">Calendar</button>
    <button data-v="log">Trades</button>
    <button data-v="stats">Stats</button>
    <button data-v="edge">Edge</button>
    <button data-v="discipline">Discipline</button>
    <button data-v="import">Import</button>
    <button data-v="settings">Settings</button>
  </nav>
  <div class="hdr-right">
    <button id="statusChip" class="status-chip na" title="Trade status: open the Edge tab">…</button>
    <select id="acctSel" class="acct-sel" title="Which account to show"></select>
    <button class="btn sm" id="addBtn">+ Add trade</button>
    <button class="btn sm" id="backupBtn" title="Save a backup file of everything (including screenshots)">Backup</button>
  </div>
</header>
<main id="main"></main>

<script>
"use strict";
// ======================================================================
// Storage (IndexedDB, all on this computer)
// ======================================================================
const DB_NAME = "nq-trade-journal";
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME,1);
    r.onupgradeneeded = ()=>{ const d=r.result; d.createObjectStore("trades",{keyPath:"id"}); d.createObjectStore("kv"); };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{
    const t = db.transaction(store,mode); const s=t.objectStore(store);
    let out; const r = fn(s); if(r) r.onsuccess=()=>{out=r.result};
    t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  });
}
const getAll = ()=>tx("trades","readonly",s=>s.getAll());
const putTrade = t=>tx("trades","readwrite",s=>s.put(t));
const delTrade = id=>tx("trades","readwrite",s=>s.delete(id));
async function delMany(ids){ await new Promise((res,rej)=>{ const t=db.transaction("trades","readwrite"); const s=t.objectStore("trades"); ids.forEach(id=>s.delete(id)); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
const clearTrades = ()=>tx("trades","readwrite",s=>s.clear());
const kvGet = k=>tx("kv","readonly",s=>s.get(k));
const kvSet = (k,v)=>tx("kv","readwrite",s=>s.put(v,k));
async function putMany(list){
  await new Promise((res,rej)=>{
    const t=db.transaction("trades","readwrite"); const s=t.objectStore("trades");
    list.forEach(x=>s.put(x)); t.oncomplete=res; t.onerror=()=>rej(t.error);
  });
}

// ======================================================================
// State
// ======================================================================
const DEFAULTS = {tickSize:0.25, targetTicks:40, stopTicks:35, pointValue:20, commission:5.76, beTicks:2,
  maxTradesDay:3, maxLossesDay:2, cooldownMin:5, rulesStart:"", hmWeeks:26,
  goodScore:80, rollTrades:20, behaviorWindow:10,
  rules:["No revenge trading","No more than 3 trades today","Was patient: only took valid setups",
         "Done for the day if not filled after a loss","Waited for the right candle to form"]};
const S = {trades:[], accounts:[], acct:"all", checkins:{}, settings:{...DEFAULTS}, view:"calendar", cal:null, dayFilter:null, onlyUntagged:false,
           fDir:"", fSetup:"", seedDone:false};
const OPTS = {
  setup:["Range","Staircase","Other"],
  meter:["RANGE","LONG DIRECTIONAL","SHORT DIRECTIONAL","WAIT","LONG","SHORT","Off"],
  loc:["Bottom","Middle","Top"],
  followed:["Yes","No"],
  outcome:["Target","Stop","Breakeven","Manual"],
  dir:["Long","Short"]
};
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

// ---- Accounts ----
// Each account has its own contract ($ per point), commission and, for prop accounts, the rules to pass.
const INSTRUMENTS = {NQ:20, MNQ:2};
const KINDS = ["Practice","Prop","Live"];
const DEFAULT_ACCOUNT = {id:"acc-playback", name:"Playback (practice)", kind:"Practice", ntName:"Playback101", instrument:"NQ", pointValue:20, commission:5.76,
  profitTarget:null, maxDrawdown:null, dailyLoss:null, startDate:""};
const newAccount = o=>({id:uid(), name:"New account", kind:"Prop", ntName:"", instrument:"MNQ", pointValue:2, commission:1.50,
  profitTarget:null, maxDrawdown:null, dailyLoss:null, startDate:"", ...o});
const acctById = id=>S.accounts.find(a=>a.id===id)||S.accounts[0]||DEFAULT_ACCOUNT;
const defaultAcctId = ()=>S.acct!=="all"&&S.accounts.some(a=>a.id===S.acct)?S.acct:(S.accounts[0]||DEFAULT_ACCOUNT).id;
const pvOf = t=>t.pv||INSTRUMENTS[t.instrument]||acctById(t.accountId).pointValue;
async function saveAccounts(){ await kvSet("accounts",S.accounts); fillAcctSelect(); }
function fillAcctSelect(){
  const sel=$("#acctSel"); if(!sel) return;
  sel.innerHTML=`<option value="all">All accounts</option>`+S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} · ${a.instrument}</option>`).join("");
  sel.value=S.acct;
  const sub=$("#hdrSub"); if(sub){ const a=S.acct==="all"?null:acctById(S.acct); sub.innerHTML=a?`· ${a.instrument}<span class="acct-tag ${a.kind}">${a.kind}</span>`:"· all accounts"; }
}

// ======================================================================
// Helpers
// ======================================================================
const $ = (sel,root=document)=>root.querySelector(sel);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v=>(v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const moneyShort = v=>(v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{maximumFractionDigits:0});
const pts = v=>(v>0?"+":"")+(+v).toFixed(2);
const pct = v=>isFinite(v)?(v*100).toFixed(1)+"%":"–";
const cls = v=>v>0?"pos":v<0?"neg":"mut";
const pad = n=>String(n).padStart(2,"0");
const dayKey = d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
// CME trading day (what Lucid / Tradovate use): the session starts 5:00 PM New York time.
// Anything at or after 5 PM ET counts toward the next day; Sunday evening counts toward Monday.
const _etFmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",hourCycle:"h23"});
function tradeDay(d,noTime){
  if(noTime) return dayKey(d);
  const p={}; _etFmt.formatToParts(d).forEach(x=>p[x.type]=+x.value);
  const u=new Date(Date.UTC(p.year,p.month-1,p.day,p.hour+7));
  const dow=u.getUTCDay(); if(dow===6) u.setUTCDate(u.getUTCDate()+2); else if(dow===0) u.setUTCDate(u.getUTCDate()+1);
  return u.getUTCFullYear()+"-"+pad(u.getUTCMonth()+1)+"-"+pad(u.getUTCDate());
}
const tday = t=>tradeDay(t.date||new Date(t.entryTime),t.noTime);
const todayTD = ()=>tradeDay(new Date());
const fmtDate = d=>d.toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"});
const fmtTime = d=>d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"});
function toast(msg,ms=3200){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }
function download(name,blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500); }
function pvFor(instr){
  const s=(instr||"").toUpperCase().trim();
  const map=[["MNQ",2],["NQ",20],["MES",5],["ES",50],["MYM",0.5],["YM",5],["M2K",5],["RTY",50],["MCL",100],["CL",1000],["MGC",10],["GC",100],["SIL",1000],["SI",5000]];
  for(const [k,v] of map) if(s.startsWith(k)) return v;
  return S.settings.pointValue;
}

// ======================================================================
// Trade math
// ======================================================================
// Every trade: {id, source:'nt'|'manual', entryTime (ISO), noTime, dir, qty, instrument, ...tags}
// NinjaTrader trades carry their own points / net / MAE / MFE from the export.
// Manual trades are worked out from Outcome + Settings (target/stop ticks, $ per point, commission).
const isImported = t=>t.source==="nt"||t.source==="tv";
const srcName = t=>t.source==="nt"?"NinjaTrader":t.source==="tv"?"Tradovate":"Manual";
function calc(t){
  const st=S.settings;
  let points, net;
  if(t.source==="tv"){
    // Tradovate exports have no fees: net always uses the account's current commission per contract
    const q=t.qty||1, com=+acctById(t.accountId).commission||0;
    points=t.points; net=Math.round((points*(t.pv||pvOf(t))*q - com*q)*100)/100;
  } else if(isImported(t)){
    points=t.points; net=t.net;
  } else {
    const q=t.qty||1, pv=pvOf(t), com=acctById(t.accountId).commission;
    if(t.outcome==="Target") points=st.targetTicks*st.tickSize;
    else if(t.outcome==="Stop") points=-st.stopTicks*st.tickSize;
    else if(t.outcome==="Breakeven") points=0;
    else points=+t.manualPts||0;
    net=points*pv*q - com*q;
  }
  const beBand = st.beTicks*st.tickSize;
  const result = points>beBand?"Win":points< -beBand?"Loss":"BE";
  return {points,net,result};
}
function enrich(t){ const c=calc(t); return {...t,...c,date:new Date(t.entryTime)}; }

function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"";
  const delim=[",",";","\t"].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(f); f=""; }
    else if(c==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=="\r") f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
const norm = s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
function num(s){
  if(s==null) return NaN; s=String(s).trim(); if(!s) return NaN;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true; s=s.slice(1,-1);}
  s=s.replace(/[$€£\s]/g,"");
  if(s.startsWith("-")){neg=!neg; s=s.slice(1);}
  // 1.234,56 (EU) vs 1,234.56 (US)
  if(/,\d{1,2}$/.test(s) && s.indexOf(".")<s.lastIndexOf(",")) s=s.replace(/\./g,"").replace(",",".");
  else s=s.replace(/,/g,"");
  const v=parseFloat(s); return isNaN(v)?NaN:(neg?-v:v);
}
function parseDate(s){
  s=String(s||"").trim(); if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m) return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  m=s.match(/^(\d{1,2})([\/.])(\d{1,2})\2(\d{2,4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?/);
  if(m){
    let mo,dd; if(m[2]==="."){dd=+m[1];mo=+m[3]} else {mo=+m[1];dd=+m[3]}
    let y=+m[4]; if(y<100) y+=2000;
    let h=+m[5]; const ap=(m[8]||"").toUpperCase();
    if(ap==="PM"&&h<12) h+=12; if(ap==="AM"&&h===12) h=0;
    return new Date(y,mo-1,dd,h,+m[6],+(m[7]||0));
  }
  const d=new Date(s); return isNaN(d)?null:d;
}
function importNinjaCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2) throw new Error("That file has no trade rows.");
  const H=rows[0].map(norm);
  const col=(...names)=>{ for(const n of names){ const i=H.indexOf(n); if(i>=0) return i; } return -1; };
  const C={
    num:col("tradenumber","trade"), instr:col("instrument"), acct:col("account"),
    pos:col("marketpos","marketposition","position"), qty:col("qty","quantity"),
    ep:col("entryprice"), xp:col("exitprice"), et:col("entrytime"), xt:col("exittime"),
    en:col("entryname"), xn:col("exitname"), profit:col("profit","netprofit"),
    cum:col("cumnetprofit","cumulativenetprofit"), com:col("commission"),
    fees:["clearingfee","exchangefee","ipfee","nfafee"].map(n=>H.indexOf(n)).filter(i=>i>=0),
    mae:col("mae"), mfe:col("mfe"), bars:col("bars")
  };
  const need=["pos","ep","xp","et","profit"].filter(k=>C[k]<0);
  if(need.length) throw new Error("This doesn't look like a NinjaTrader Trades export (missing: "+need.join(", ")+"). Export from Trade Performance → Trades tab.");
  const data=rows.slice(1).filter(r=>r[C.et]&&r[C.pos]);
  const get=(r,i)=>i>=0?r[i]:"";
  // Is "Profit" already after commission? Check against the cumulative net profit column.
  let profitIsNet=false;
  if(C.cum>=0 && data.length>1){
    let match=0, tot=0;
    for(let i=1;i<data.length;i++){
      const d=num(get(data[i],C.cum))-num(get(data[i-1],C.cum)), p=num(get(data[i],C.profit));
      if(isFinite(d)&&isFinite(p)){ tot++; if(Math.abs(d-p)<0.011) match++; }
    }
    profitIsNet = tot>0 && match/tot>0.6;
  }
  const existing=new Set(S.trades.filter(t=>t.key).map(t=>t.key));
  const out=[]; let dup=0, bad=0; const unlinked={};
  for(const r of data){
    const et=parseDate(get(r,C.et)), xt=parseDate(get(r,C.xt));
    const ep=num(get(r,C.ep)), xp=num(get(r,C.xp));
    if(!et||!isFinite(ep)||!isFinite(xp)){ bad++; continue; }
    const posTxt=get(r,C.pos).toLowerCase(); const dir=posTxt.includes("short")?"Short":"Long";
    const qty=Math.abs(num(get(r,C.qty)))||1;
    const instrument=get(r,C.instr).trim(), account=get(r,C.acct).trim();
    const key=[account,instrument,get(r,C.et),get(r,C.xt),ep,xp,qty,dir].join("|");
    if(existing.has(key)){ dup++; continue; } existing.add(key);
    const pv=pvFor(instrument);
    const profit=num(get(r,C.profit))||0;
    let com=Math.abs(num(get(r,C.com))||0); C.fees.forEach(i=>{ com+=Math.abs(num(r[i])||0); });
    const net = profitIsNet ? profit : profit-com;
    const points=(xp-ep)*(dir==="Long"?1:-1);
    const xn=get(r,C.xn).trim();
    const tick=S.settings.tickSize, beBand=S.settings.beTicks*tick;
    let outcome = /target|profit/i.test(xn)?"Target": /stop|trail/i.test(xn)?"Stop":"Manual";
    if(Math.abs(points)<=beBand) outcome="Breakeven";
    const maeD=Math.abs(num(get(r,C.mae))), mfeD=Math.abs(num(get(r,C.mfe)));
    const linked=S.accounts.find(a=>a.ntName&&a.ntName.trim().toLowerCase()===account.toLowerCase());
    const accountId=linked?linked.id:defaultAcctId();
    if(!linked&&account) unlinked[account]=(unlinked[account]||0)+1;
    out.push({
      id:uid(), source:"nt", key, account, accountId, instrument, dir, qty, pv,
      entryTime:et.toISOString(), exitTime:xt?xt.toISOString():null,
      entryPrice:ep, exitPrice:xp, entryName:get(r,C.en).trim(), exitName:xn,
      points:Math.round(points/tick)*tick, net:Math.round(net*100)/100, commission:com,
      outcome, maePts:isFinite(maeD)?maeD/(pv*qty):null, mfePts:isFinite(mfeD)?mfeD/(pv*qty):null,
      bars:num(get(r,C.bars))||null,
      setup:"", meter:"", loc:"", atr:null, followed:"", notes:"", images:[]
    });
  }
  return {trades:out,dup,bad,profitIsNet,unlinked};
}

// ======================================================================
function isTradovateRows(rows){ const H=(rows[0]||[]).map(norm); return H.includes("buyfillid")&&H.includes("sellfillid"); }
const idLess=(a,b)=>{ a=String(a).trim(); b=String(b).trim(); return a.length!==b.length?a.length<b.length:a<b; };
function tvDefaultAcctId(){
  const a=S.accounts.find(x=>x.id===S.tvAcct)||(S.acct!=="all"&&S.accounts.find(x=>x.id===S.acct&&x.kind!=="Practice"))||S.accounts.find(x=>x.kind!=="Practice")||S.accounts[0]||DEFAULT_ACCOUNT;
  return a.id;
}
function isTradovateOrders(rows){ const H=(rows[0]||[]).map(norm); return H.includes("bs")&&H.includes("filltime")&&H.includes("type"); }
const TV_MATCH_MS=3000;
// Is there already an imported Tradovate trade for these fills? (same account + direction, entry within 3 s)
const findTvTwin=(accountId,dir,entry)=>S.trades.find(t=>t.source==="tv"&&t.accountId===accountId&&t.dir===dir&&Math.abs(new Date(t.entryTime)-entry)<=TV_MATCH_MS);
// New imported trades take over trades you logged by hand.
// Same day + same number of trades -> paired in time order. Otherwise nearest same-direction trade within 15 min.
function mergeHandLogged(cands,accountId,notes){
  const byDay={}; cands.forEach(c=>(byDay[tday(c)]??=[]).push(c));
  const out=[]; let merged=0;
  for(const [day,list] of Object.entries(byDay)){
    list.sort((a,b)=>a.entryTime<b.entryTime?-1:1);
    const hand=S.trades.filter(t=>t.source==="manual"&&!t.noTime&&t.accountId===accountId&&tday(t)===day).sort((a,b)=>a.entryTime<b.entryTime?-1:1);
    const pairs=new Map();
    if(hand.length&&hand.length===list.length) list.forEach((c,i)=>pairs.set(c,hand[i]));
    else { const used=new Set(); for(const c of list){ let best=null,bd=15*60000;
      for(const h of hand){ if(used.has(h.id)||h.dir!==c.dir) continue; const d=Math.abs(new Date(h.entryTime)-new Date(c.entryTime)); if(d<=bd){best=h;bd=d;} }
      if(best){ used.add(best.id); pairs.set(c,best); } } }
    for(const c of list){ const h=pairs.get(c);
      if(h){ merged++; if(h.dir!==c.dir) notes.push(`${fmtDate(new Date(c.entryTime))} ${fmtTime(new Date(c.entryTime))}: you logged ${h.dir}, the fills say ${c.dir}`);
        out.push({...h,...c,id:h.id}); }
      else out.push({...c,id:uid(),setup:"",meter:"",loc:"",atr:null,followed:"",notes:"",images:[]}); }
  }
  return {out,merged};
}
function outcomeFor(points,exitType){
  const st=S.settings, beBand=st.beTicks*st.tickSize;
  if(Math.abs(points)<=beBand) return "Breakeven";
  if(exitType){ if(/stop|trail/i.test(exitType)) return "Stop"; if(/limit/i.test(exitType)) return "Target"; return "Manual"; }
  const tick=st.tickSize;
  if(Math.abs(points-st.targetTicks*tick)<=beBand) return "Target";
  if(Math.abs(points+st.stopTicks*tick)<=beBand) return "Stop";
  return "Manual";
}
function importTradovateCSV(text,accountId){
  const rows=parseCSV(text);
  if(rows.length<2) throw new Error("That file has no trade rows.");
  const H=rows[0].map(norm);
  const C={sym:H.indexOf("symbol"),bid:H.indexOf("buyfillid"),sid:H.indexOf("sellfillid"),qty:H.indexOf("qty"),
    bp:H.indexOf("buyprice"),sp:H.indexOf("sellprice"),pnl:H.indexOf("pnl"),bt:H.indexOf("boughttimestamp"),st:H.indexOf("soldtimestamp")};
  const need=Object.entries(C).filter(([k,v])=>v<0&&k!=="pnl").map(([k])=>k);
  if(need.length) throw new Error("This doesn't look like a Tradovate Performance export (missing: "+need.join(", ")+").");
  const acct=acctById(accountId);
  // Group fill pairings by the entry fill: one entry fill = one trade
  const groups=new Map(); let bad=0;
  for(const r of rows.slice(1)){
    const bt=parseDate(r[C.bt]), st=parseDate(r[C.st]);
    const bp=num(r[C.bp]), sp=num(r[C.sp]), q=Math.abs(num(r[C.qty]))||0;
    const bid=String(r[C.bid]||"").trim(), sid=String(r[C.sid]||"").trim(), sym=String(r[C.sym]||"").trim();
    if(!bt||!st||!isFinite(bp)||!isFinite(sp)||!q||!bid||!sid){ bad++; continue; }
    const short = st<bt || (+st===+bt && idLess(sid,bid));
    const key="tv|"+sym+"|"+(short?sid:bid);
    let g=groups.get(key);
    if(!g){ g={key,sym,dir:short?"Short":"Long",entryTime:short?st:bt,exitTime:short?bt:st,entryPrice:short?sp:bp,qty:0,exitSum:0}; groups.set(key,g); }
    const xt=short?bt:st; if(xt>g.exitTime) g.exitTime=xt;
    g.qty+=q; g.exitSum+=(short?bp:sp)*q;
  }
  const existing=new Set(S.trades.filter(t=>t.key).map(t=>t.key));
  const tick=S.settings.tickSize;
  const cands=[], updates=[]; let dup=0;
  for(const g of groups.values()){
    if(existing.has(g.key)){ dup++; continue; } existing.add(g.key);
    const qty=g.qty, exitPrice=g.exitSum/qty;
    const points=Math.round((exitPrice-g.entryPrice)*(g.dir==="Long"?1:-1)*10000)/10000;
    const fills={source:"tv", key:g.key, account:acct.name, accountId, instrument:g.sym, dir:g.dir, qty, pv:pvFor(g.sym),
      entryTime:g.entryTime.toISOString(), exitTime:g.exitTime.toISOString(), noTime:false,
      entryPrice:g.entryPrice, exitPrice:Math.round(exitPrice/tick)*tick, entryName:"", exitName:"",
      points, outcome:outcomeFor(points), manualPts:null, maePts:null, mfePts:null, bars:null};
    // Trade already built from Orders.csv: fill in the exact fills, keep its exit type and your tags
    const twin=findTvTwin(accountId,g.dir,g.entryTime);
    if(twin&&!updates.some(u=>u.id===twin.id)){ updates.push({...twin,...fills,id:twin.id,exitName:twin.exitName,outcome:twin.exitName?outcomeFor(points,twin.exitName):fills.outcome}); continue; }
    cands.push(fills);
  }
  const notes=[]; const {out,merged}=mergeHandLogged(cands,accountId,notes);
  return {trades:[...out,...updates],dup,bad,merged:merged+updates.length,notes,unlinked:{}};
}
// Orders.csv: rebuild trades from filled orders so we know HOW each one closed (Limit = target, Stop = stop, Market = by hand)
function importTradovateOrders(text,accountId){
  const rows=parseCSV(text);
  if(rows.length<2) throw new Error("That file has no orders.");
  const H=rows[0].map(norm), c=n=>H.indexOf(n);
  const C={id:c("orderid"),side:c("bs"),contract:c("contract"),status:c("status"),type:c("type"),qty:c("filledqty"),price:c("avgfillprice"),price2:c("avgprice"),time:c("filltime"),ts:c("timestamp"),acct:c("account")};
  const acct=acctById(accountId);
  const orders=[]; let bad=0;
  for(const r of rows.slice(1)){
    const g=i=>i>=0?String(r[i]??"").trim():"";
    if(!/filled/i.test(g(C.status))) continue;
    const qty=Math.abs(num(g(C.qty))), price=isFinite(num(g(C.price2)))?num(g(C.price2)):num(g(C.price)), time=parseDate(g(C.time))||parseDate(g(C.ts));
    if(!qty||!isFinite(price)||!time){ bad++; continue; }
    orders.push({id:g(C.id),side:/^b/i.test(g(C.side))?1:-1,contract:g(C.contract),type:g(C.type),qty,price,time,acct:g(C.acct)});
  }
  if(!orders.length) throw new Error("No filled orders in that file.");
  orders.sort((a,b)=>a.time-b.time||(idLess(a.id,b.id)?-1:1));
  // Walk the position: flat -> open = entry, back to flat = trade done
  const pos={}, open={}, built=[];
  for(const o of orders){
    const k=o.acct+"|"+o.contract; let p=pos[k]||0, q=o.qty;
    while(q>0){
      if(p===0) open[k]={dir:o.side>0?"Long":"Short",entryId:o.id,contract:o.contract,entryTime:o.time,lastEntry:o.time,eSum:0,eQty:0,xSum:0,xQty:0,exitTime:o.time,exitType:""};
      const t=open[k];
      if(p===0||Math.sign(p)===o.side){ t.eSum+=o.price*q; t.eQty+=q; t.lastEntry=o.time; p+=o.side*q; q=0; }
      else { const n=Math.min(q,Math.abs(p)); t.xSum+=o.price*n; t.xQty+=n; t.exitTime=o.time; t.exitType=o.type; p+=o.side*n; q-=n;
        if(p===0){ built.push(t); delete open[k]; } }
    }
    pos[k]=p;
  }
  const tick=S.settings.tickSize, existing=new Set(S.trades.filter(t=>t.key).map(t=>t.key));
  const cands=[], updates=[]; let dup=0;
  for(const t of built){
    // Keep exact average fill prices (e.g. 26940.125). Rounding to a tick made P&L drift from the broker by $1-2
    const entryPrice=Math.round(t.eSum/t.eQty*10000)/10000, exitPrice=Math.round(t.xSum/t.xQty*10000)/10000;
    const points=Math.round((exitPrice-entryPrice)*(t.dir==="Long"?1:-1)*10000)/10000;
    const outcome=outcomeFor(points,t.exitType);
    // Trades already imported from Performance.csv: just set how they closed
    const twins=S.trades.filter(x=>x.source==="tv"&&x.accountId===accountId&&x.dir===t.dir&&new Date(x.entryTime)>=t.entryTime-TV_MATCH_MS&&new Date(x.entryTime)<=+t.lastEntry+TV_MATCH_MS);
    if(twins.length){ twins.forEach(x=>{ const o=outcomeFor(x.points,t.exitType); if(x.outcome!==o||x.exitName!==t.exitType) updates.push({...x,outcome:o,exitName:t.exitType}); else dup++; }); continue; }
    const key="tvo|"+t.contract+"|"+t.entryId;
    if(existing.has(key)){ dup++; continue; } existing.add(key);
    cands.push({source:"tv",key,account:acct.name,accountId,instrument:t.contract,dir:t.dir,qty:t.eQty,pv:pvFor(t.contract),
      entryTime:t.entryTime.toISOString(),exitTime:t.exitTime.toISOString(),noTime:false,entryPrice,exitPrice,entryName:"",exitName:t.exitType,
      points,outcome,manualPts:null,maePts:null,mfePts:null,bars:null});
  }
  const notes=[]; const {out,merged}=mergeHandLogged(cands,accountId,notes);
  const stillOpen=Object.keys(open).length;
  if(stillOpen) notes.push(`${stillOpen} position${stillOpen>1?"s were":" was"} still open at the end of the file and was skipped`);
  return {trades:[...out,...updates],dup,bad,merged:merged+updates.length,notes,unlinked:{}};
}

const inAcct = t=>S.acct==="all"||t.accountId===S.acct;

// ---------------- Prop account progress ----------------
function propCard(){
  if(S.acct==="all") return "";
  const a=acctById(S.acct);
  if(!(a.profitTarget||a.maxDrawdown||a.dailyLoss)) return "";
  let T=allEnriched(); if(a.startDate) T=T.filter(t=>tday(t)>=a.startDate);
  let cum=0, peak=0, worstDD=0; T.forEach(t=>{ cum+=t.net; peak=Math.max(peak,cum); worstDD=Math.max(worstDD,peak-cum); });
  const curDD=peak-cum;
  const byDay={}; T.forEach(t=>{const k=tday(t); byDay[k]=(byDay[k]||0)+t.net;});
  const todayK=todayTD(), today=byDay[todayK]||0;
  const badDays=a.dailyLoss?Object.entries(byDay).filter(([k,v])=>v<=-a.dailyLoss).length:0;
  const breached=(a.maxDrawdown&&worstDD>=a.maxDrawdown)||badDays>0;
  const passed=!breached&&a.profitTarget&&cum>=a.profitTarget;
  const status=breached?`<span class="status neg">RULE BROKEN</span>`:passed?`<span class="status pos">TARGET REACHED</span>`:`<span class="status" style="color:#c9a2ff">IN PROGRESS</span>`;
  const bar=(v,max,col)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,v/max*100))}%;background:${col}"></i></div>`;
  let rows="";
  if(a.profitTarget) rows+=`<div><h3>Profit target</h3><b class="num ${cls(cum)}">${money(cum)}</b> <span class="hint">of ${money(a.profitTarget)}</span>${bar(cum,a.profitTarget,"#22c55e")}
    <div class="hint">${cum>=a.profitTarget?"Reached":money(a.profitTarget-cum)+" to go"}</div></div>`;
  if(a.maxDrawdown) rows+=`<div><h3>Drawdown from peak</h3><b class="num ${curDD>0?"neg":""}">${money(-curDD)}</b> <span class="hint">limit ${money(a.maxDrawdown)}</span>${bar(curDD,a.maxDrawdown,curDD>=a.maxDrawdown*0.7?"#ef4444":"#f5b62b")}
    <div class="hint">Room left: <b>${money(Math.max(0,a.maxDrawdown-curDD))}</b> · worst so far ${money(-worstDD)}</div></div>`;
  if(a.dailyLoss) rows+=`<div><h3>Today</h3><b class="num ${cls(today)}">${money(today)}</b> <span class="hint">daily loss limit ${money(a.dailyLoss)}</span>${bar(Math.max(0,-today),a.dailyLoss,"#ef4444")}
    <div class="hint">${today<0?"Room left today: <b>"+money(Math.max(0,a.dailyLoss+today))+"</b>":"No loss today"}${badDays?` · <span class="neg">${badDays} day(s) hit the limit</span>`:""}</div></div>`;
  return `<div class="card prop"><div style="display:flex;align-items:center;gap:10px"><h2 style="margin:0">${esc(a.name)}<span class="acct-tag ${a.kind}">${a.kind}</span></h2><span style="margin-left:auto">${status}</span></div>
    <div class="rows">${rows}</div><p class="hint" style="margin:10px 0 0">From closed trades in the journal${a.startDate?" since "+a.startDate:""}. Many prop firms trail the drawdown on open P&L during the trade, so keep a buffer and check your firm's dashboard.</p></div>`;
}

// ---------------- Edge & behavior (from the Google Sheet idea, v2) ----------------
// Two separate questions, like the sheet's SOP:
//   EDGE slipping?     Last N trades (default 20) vs your long-run numbers, in R (1R = your stop in $).
//                      Flag only when the recent average falls below the normal range for N trades
//                      (one-sided 95%), so ordinary losing streaks don't set it off.
//   BEHAVIOR slipping? Judged only by whether you followed the rules (behavior score), never by P&L.
//                      Recent average score below the bar, or a revenge trade today = stop.
// Status: STOP if behavior is slipping, a revenge trade today, or the edge is below normal AND negative.
//         CAUTION if the edge is below normal but still positive. Otherwise KEEP TRADING.
const EXEC=[
  {k:"setup",  label:"A / B+ setup only",   cat:"Trade quality",     pen:30},
  {k:"fomo",   label:"No FOMO entry",       cat:"Entry quality",     pen:30},
  {k:"size",   label:"Correct size",        cat:"Risk management",   pen:30},
  {k:"early",  label:"No early close",      cat:"Trade management",  pen:30},
  {k:"revenge",label:"No revenge trade",    cat:"Psychology",        pen:60}];
function behaviorScore(t){
  const ex=t.exec||{}, rated=EXEC.filter(r=>ex[r.k]==="y"||ex[r.k]==="n");
  if(!rated.length) return null;
  let s=rated.filter(r=>ex[r.k]==="y").length/rated.length*100;
  EXEC.forEach(r=>{ if(ex[r.k]==="n") s-=r.pen; });
  return Math.max(0,Math.min(100,Math.round(s)));
}
const scoreText=s=>s==null?"not rated":s+" / 100";
function scoreBadge(s){ if(s==null) return '<span class="mut">–</span>'; const g=S.settings.goodScore; return `<span class="score ${s>=g?"g":s>=50?"m":"b"}">${s}</span>`; }
// 1R = the stop in dollars for that trade (stop ticks × tick × $/pt × contracts)
const oneR=t=>{ const st=S.settings, pv=isImported(t)?(t.pv||pvOf(t)):pvOf(t); return st.stopTicks*st.tickSize*pv*(t.qty||1); };
const rOf=t=>t.net/oneR(t);
const fmtR=v=>isFinite(v)?(v>=0?"+":"")+v.toFixed(2)+"R":"–";
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
const sdev=a=>{ if(a.length<2) return NaN; const m=mean(a); return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1)); };
function edgeModel(){
  const st=S.settings, T=allEnriched(), N=Math.max(5,st.rollTrades||20), BW=Math.max(3,st.behaviorWindow||10);
  const R=T.map(rOf);
  // ---- edge: recent N vs baseline (trades before them; all trades if history is short)
  const enough=T.length>=N+10, recent=R.slice(-N), base=enough?R.slice(0,-N):R;
  const recentAvg=mean(recent), baseAvg=mean(base), baseSd=sdev(R);
  const lowerBand=baseAvg-1.645*baseSd/Math.sqrt(Math.max(1,recent.length));
  let edge="na";
  if(T.length>=Math.min(N,15)){
    if(recentAvg<lowerBand) edge=recentAvg<0?"broken":"slipping"; else edge="ok";
  }
  const recentT=T.slice(-N), rw=recentT.filter(t=>t.result==="Win").length, rl=recentT.filter(t=>t.result==="Loss").length;
  const bw_=T.slice(0,enough?-N:undefined), baseW=bw_.filter(t=>t.result==="Win").length, baseL=bw_.filter(t=>t.result==="Loss").length;
  // ---- behavior: only the rule scores
  const rated=T.filter(t=>behaviorScore(t)!=null), recentRated=rated.slice(-BW);
  const recentScore=mean(recentRated.map(behaviorScore));
  const lastDay=T.length?tday(T[T.length-1]):null;
  const todayTrades=lastDay?T.filter(t=>tday(t)===lastDay):[];
  // only counts for the real current day, so an old revenge trade doesn't block you forever
  const revengeToday=lastDay===todayTD() && (todayTrades.some(t=>(t.exec||{}).revenge==="n") || (todayTrades.length&&autoViolations(todayTrades).some(v=>v.includes("re-entered"))));
  let beh="na";
  if(revengeToday) beh="revenge";
  else if(recentRated.length>=3) beh=recentScore>=st.goodScore?"ok":"slipping";
  // ---- status
  const reasons=[]; let status="na";
  if(beh==="revenge") reasons.push(`Revenge trade today: done for the day`);
  if(beh==="slipping") reasons.push(`Behavior slipping: last ${recentRated.length} rated trades average ${Math.round(recentScore)} (need ${st.goodScore}+)`);
  if(edge==="broken") reasons.push(`Edge below normal and negative: last ${recent.length} trades ${fmtR(recentAvg)} per trade (normal ≥ ${fmtR(lowerBand)})`);
  if(reasons.length) status="stop";
  else if(edge==="slipping"){ status="caution"; reasons.push(`Edge below normal: last ${recent.length} trades ${fmtR(recentAvg)} per trade vs usual ${fmtR(baseAvg)}`); }
  else if(edge==="ok"||beh==="ok") status="keep";
  // ---- info: good vs bad behavior (not used for status)
  const good=rated.filter(t=>behaviorScore(t)>=st.goodScore), bad=rated.filter(t=>behaviorScore(t)<st.goodScore);
  const rGood=mean(good.map(rOf)), rBad=mean(bad.map(rOf));
  // ---- cost of each rule break, in R (only trusted with 5+ breaks)
  const cost=EXEC.map(r=>{ const br=rated.filter(t=>(t.exec||{})[r.k]==="n"), ok=rated.filter(t=>(t.exec||{})[r.k]==="y");
    const aB=mean(br.map(rOf)), aO=mean(ok.map(rOf));
    return {...r, n:br.length, rated:br.length+ok.length, avgBroken:aB, avgOk:aO, cost:br.length&&ok.length?br.length*(aO-aB):NaN, trusted:br.length>=5&&ok.length>=5}; });
  const rDollar=T.length?mean(T.slice(-N).map(oneR)):NaN;
  // ---- streaks
  let bw=0,bl=0,cw=0,cl=0; T.forEach(t=>{ if(t.result==="Win"){cw++;cl=0;bw=Math.max(bw,cw);} else if(t.result==="Loss"){cl++;cw=0;bl=Math.max(bl,cl);} });
  return {T,R,N,BW,enough,recent,recentAvg,baseAvg,baseSd,lowerBand,edge,rw,rl,baseW,baseL,rated,recentRated,recentScore,beh,lastDay,
    status,reasons,good,bad,rGood,rBad,cost,rDollar,bw,bl,cw,cl,
    edgeUp:edge==="na"?null:edge==="ok", behUp:beh==="na"?null:beh==="ok"};
}
const STATUS_TXT={keep:"✅ KEEP TRADING",caution:"⚠️ CAUTION",stop:"⛔ STOP TRADING",na:"Not enough data"};
function updateStatusChip(){
  const c=$("#statusChip"); if(!c) return;
  const m=edgeModel(); c.className="status-chip "+m.status; c.textContent=STATUS_TXT[m.status];
  c.title=m.reasons.length?m.reasons.join("\n"):"Open the Edge tab";
}
function rollSVG(E){
  const T=E.T, N=E.N, R=E.R;
  if(T.length<N+1) return `<p class="hint">The chart shows after ${N+1} trades (you have ${T.length}).</p>`;
  const W=900,H=210,P=44, vals=[];
  for(let i=N-1;i<T.length;i++) vals.push(mean(R.slice(i-N+1,i+1)));
  const lines=[0,E.baseAvg,E.lowerBand].filter(isFinite);
  const mn=Math.min(...vals,...lines), mx=Math.max(...vals,...lines), span=(mx-mn)||1;
  const x=i=>P+(W-P-10)*i/(T.length-1), y=v=>10+(H-30)*(1-(v-mn)/span);
  const line=vals.map((v,j)=>(j?"L":"M")+x(j+N-1).toFixed(1)+","+y(v).toFixed(1)).join("");
  const bars=T.map((t,i)=>{ const s=behaviorScore(t); return s==null?"":`<rect x="${(x(i)-3).toFixed(1)}" y="${(H-20-(H-30)*s/100).toFixed(1)}" width="6" height="${((H-30)*s/100).toFixed(1)}" fill="${s>=S.settings.goodScore?"#22c55e":s>=50?"#f5b62b":"#ef4444"}" opacity=".2"/>`; }).join("");
  const hl=(v,col,dash,label)=>`<line x1="${P}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="${col}" ${dash?'stroke-dasharray="5 4"':""} opacity=".8"/><text x="2" y="${y(v)+4}">${label}</text>`;
  const last=vals[vals.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${bars}
    ${hl(0,"#3a4450",true,"0R")}${hl(E.baseAvg,"#3b82f6",false,fmtR(E.baseAvg))}${hl(E.lowerBand,"#f5b62b",true,fmtR(E.lowerBand))}
    <path d="${line}" fill="none" stroke="${last>=E.lowerBand?"#22c55e":last>=0?"#f5b62b":"#ef4444"}" stroke-width="2.4"/></svg>
    <p class="hint" style="margin:4px 0 0">Line: your average R over the last ${N} trades. <span style="color:#3b82f6">Blue</span> = your normal. <span style="color:var(--gold)">Yellow dashed</span> = bottom of the normal range. Below yellow = edge slipping. Faint bars = behavior scores.</p>`;
}
function renderEdge(m){
  const st=S.settings, E=edgeModel();
  if(!E.T.length){ m.innerHTML=`<div class="empty card">No trades in this account yet.</div>`; return; }
  const diag = E.edgeUp==null||E.behUp==null ? null : E.edgeUp&&E.behUp?"hh":!E.edgeUp&&E.behUp?"eh":E.edgeUp&&!E.behUp?"bh":"ss";
  const DIAG={hh:["Edge + execution healthy","Keep doing exactly this."],
    eh:["Edge slipping","You're following the rules but the trades aren't following through. Stop and review the setups and market conditions, even though you're behaving well."],
    bh:["Behavior slipping","The strategy still works. You're the problem right now: forcing, closing early or revenge trading. Stop, even though the strategy works."],
    ss:["FULL STOP","Both the edge and your behavior are down. Done until you've reviewed."]};
  const unrated=E.T.length-E.rated.length, rd=E.rDollar;
  const costRows=E.cost.slice().sort((a,b)=>(b.trusted-a.trusted)||((isFinite(b.cost)?b.cost:-1e9)-(isFinite(a.cost)?a.cost:-1e9))).map(r=>`<tr>
      <td>${esc(r.label)}<div class="hint">${r.cat}</div></td><td class="r num">${r.n} / ${r.rated}</td>
      <td class="r num ${cls(r.avgBroken)}">${fmtR(r.avgBroken)}</td><td class="r num ${cls(r.avgOk)}">${fmtR(r.avgOk)}</td>
      <td class="r num">${r.trusted&&isFinite(r.cost)?`<b class="${r.cost>0?"neg":"pos"}">${r.cost>0?"−":"+"}${Math.abs(r.cost).toFixed(1)}R</b>${isFinite(rd)?`<div class="hint">≈ ${money(-r.cost*rd)}</div>`:""}`:`<span class="hint">${r.n?"needs 5+ breaks":"never broken"}</span>`}</td></tr>`).join("");
  const leak=E.cost.map(r=>{ const p=r.rated?r.n/r.rated:0; return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span>${r.cat}</span><span class="num ${p>0?"neg":"pos"}">${r.rated?Math.round(p*100)+"% broken":"not rated"}</span></div>
    <div class="bar"><i style="width:${p*100}%;background:#ef4444"></i></div></div>`; }).join("");
  const edgeTxt={ok:"Inside your normal range",slipping:"Below normal (still positive)",broken:"Below normal and negative",na:"Not enough trades yet"}[E.edge];
  const behTxt={ok:"Following the rules",slipping:"Slipping",revenge:"Revenge trade: done for the day",na:"Rate 3+ trades"}[E.beh];
  m.innerHTML=`${propCard()}
    <div class="banner ${E.status}"><div class="big">${STATUS_TXT[E.status]}</div>
      <div style="margin-top:4px">${E.reasons.length?E.reasons.map(esc).join("<br>"):E.status==="keep"?"Edge is in its normal range and you're following your rules.":"Log and rate more trades to get a status."}</div>
      <div class="hint" style="margin-top:6px">I trade only when this says KEEP TRADING. I stop immediately when it says STOP.</div></div>
    <div class="grid two">
      <div class="card"><h3>Edge: is the strategy still working?</h3>
        <div class="verdict ${E.edge==="ok"?"pos":E.edge==="slipping"?"":E.edge==="broken"?"neg":"mut"}" style="${E.edge==="slipping"?"color:var(--gold)":""}">${edgeTxt}</div>
        <p style="margin:6px 0">Last ${E.recent.length} trades: <b class="${cls(E.recentAvg)}">${fmtR(E.recentAvg)}</b> per trade · ${E.rw}W ${E.rl}L<br>
          Your normal: <b>${fmtR(E.baseAvg)}</b> per trade${E.enough?` (the ${E.T.length-E.recent.length} trades before)`:" (all trades, history still short)"} · ${E.baseW}W ${E.baseL}L<br>
          Normal range for ${E.recent.length} trades starts at <b>${fmtR(E.lowerBand)}</b></p>
        <p class="hint" style="margin:0">1R = your ${st.stopTicks}-tick stop${isFinite(rd)?` (≈ ${money(rd)} right now)`:""}. A few losses in a row stay inside the normal range. That's variance, not a broken edge.</p></div>
      <div class="card"><h3>Behavior: are you following your rules?</h3>
        <div class="verdict ${E.beh==="ok"?"pos":E.beh==="na"?"mut":"neg"}">${behTxt}</div>
        <p style="margin:6px 0">Last ${E.recentRated.length} rated trades average <b>${isFinite(E.recentScore)?Math.round(E.recentScore):"–"}</b> / 100 (bar: ${st.goodScore})</p>
        <p class="hint" style="margin:0">Judged only on whether you followed the rules, never on whether the trade made money. Rate each trade right after you enter, before you know the result.</p></div>
    </div>
    ${unrated?`<p class="hint" style="color:var(--gold)">${unrated} of ${E.T.length} trades aren't rated yet. Open a trade → Execution to rate it.</p>`:""}
    <div class="grid two" style="margin-top:14px">
      <div class="card"><h3>What's slipping?</h3>
        <div class="matrix">
          <div class="hd"></div><div class="hd">Behavior ↑</div><div class="hd">Behavior ↓</div>
          <div class="hd">Edge ↑</div><div class="${diag==="hh"?"on":""}"><b>Healthy</b><br><span class="hint">edge + execution</span></div><div class="${diag==="bh"?"on":""}"><b>Behavior slipping</b><br><span class="hint">it's you 🫵</span></div>
          <div class="hd">Edge ↓</div><div class="${diag==="eh"?"on":""}"><b>Edge slipping</b><br><span class="hint">strategy / market</span></div><div class="${diag==="ss"?"on":""}"><b>Full stop</b><br><span class="hint">both down</span></div>
        </div>
        <p style="margin:12px 0 0">${diag?`<b>${DIAG[diag][0]}.</b> ${DIAG[diag][1]}`:`<span class="hint">Needs ${Math.min(E.N,15)}+ trades and 3+ rated trades.</span>`}</p></div>
      <div class="card"><h3>Where you leak (by category)</h3>${leak}</div>
    </div>
    <div class="card" style="margin-top:14px"><h3>What each rule break costs you</h3>
      <table><thead><tr><th>Rule</th><th class="r">Broken</th><th class="r">Avg when broken</th><th class="r">Avg when followed</th><th class="r">Cost</th></tr></thead><tbody style="cursor:default">${costRows}</tbody></table>
      <p class="hint" style="margin:8px 0 0">Cost = times broken × (avg R when followed − avg R when broken). Only shown once a rule has been broken 5+ times. Fewer than that is luck, not a pattern.</p></div>
    <div class="card" style="margin-top:14px"><h3>Is the edge slipping?</h3>${rollSVG(E)}</div>

// ---------------- Discipline (did I follow my rules?) ----------------
// A day is:  clean  = checked in, every rule followed, no trades needed (waiting counts!)
//            ok     = checked in, every rule followed, traded
//            auto   = traded, numbers look fine (trade count, losses, re-entry), but no check-in yet
//            bad    = any rule broken: by your check-in or by the numbers
//            none   = nothing that day
function autoViolations(list){
  const st=S.settings, v=[];
  if(st.maxTradesDay>0 && list.length>st.maxTradesDay) v.push(`${list.length} trades (max ${st.maxTradesDay})`);
  let losses=0;
  for(let i=0;i<list.length;i++){
    if(st.maxLossesDay>0 && losses>=st.maxLossesDay){ v.push(`kept trading after ${st.maxLossesDay} losses`); break; }
    if(list[i].result==="Loss") losses++;
  }
  if(st.cooldownMin>0) for(let i=1;i<list.length;i++){
    const prev=list[i-1], cur=list[i];
    if(prev.result!=="Loss"||prev.noTime||cur.noTime) continue;
    const ref=prev.exitTime?new Date(prev.exitTime):prev.date, mins=(cur.date-ref)/60000;
    if(mins>=0&&mins<st.cooldownMin){ v.push(`re-entered ${Math.max(0,Math.round(mins))} min after a loss (revenge?)`); break; }
  }
  return v;
}
function dayStatus(k,list){
  const st=S.settings;
  if(st.rulesStart && k<st.rulesStart) return {status:"none",auto:[],ci:null};
  const ci=S.checkins[k], auto=list.length?autoViolations(list):[];
  const broken=ci?ci.rules.filter(r=>!r.ok).map(r=>r.text):[];
  let status="none";
  if(auto.length||broken.length) status="bad";
  else if(ci) status=list.length?"ok":"clean";
  else if(list.length) status="auto";
  return {status,auto,broken,ci};
}
function disciplineDays(){
  const byDay={}; allEnriched().forEach(t=>{const k=tday(t);(byDay[k]=byDay[k]||[]).push(t);});
  const keys=new Set([...Object.keys(byDay),...Object.keys(S.checkins)]);
  return [...keys].sort().map(k=>{ const list=byDay[k]||[]; return {k,list,net:list.reduce((a,t)=>a+t.net,0),...dayStatus(k,list)}; }).filter(d=>d.status!=="none");
}

// ---------------- Stats ----------------
function wilson(w,n){ if(!n) return [0,1]; const z=1.96,p=w/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d; return [Math.max(0,c-h),Math.min(1,c+h)]; }
function summary(list){
  const wins=list.filter(t=>t.result==="Win"), losses=list.filter(t=>t.result==="Loss");
  const net=list.reduce((a,t)=>a+t.net,0), gp=list.filter(t=>t.net>0).reduce((a,t)=>a+t.net,0), gl=-list.filter(t=>t.net<0).reduce((a,t)=>a+t.net,0);
  return {n:list.length, w:wins.length, l:losses.length, be:list.length-wins.length-losses.length, net, gp, gl,
    pf: gl>0?gp/gl:(gp>0?Infinity:NaN), wr:(wins.length+losses.length)?wins.length/(wins.length+losses.length):NaN,
    exp:list.length?net/list.length:0, pts:list.reduce((a,t)=>a+t.points,0),
    avgW: wins.length?wins.reduce((a,t)=>a+t.net,0)/wins.length:NaN, avgL: losses.length?-losses.reduce((a,t)=>a+t.net,0)/losses.length:NaN};
}
function breakdown(title,list,keyFn,order){
  const groups={}; list.forEach(t=>{ const k=keyFn(t)||"(not tagged)"; (groups[k]=groups[k]||[]).push(t); });
  let keys=Object.keys(groups); if(order) keys.sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99));
  let rows=keys.map(k=>{ const s=summary(groups[k]); return `<tr><td>${esc(k)}</td><td class="r num">${s.n}</td><td class="r num">${pct(s.wr)}</td>
    <td class="r num ${cls(s.net)}">${money(s.net)}</td><td class="r num">${isFinite(s.pf)?s.pf.toFixed(2):s.pf===Infinity?"∞":"–"}</td><td class="r num ${cls(s.exp)}">${money(s.exp)}</td></tr>`; }).join("");
  return `<div class="card"><h3>${title}</h3><table><thead><tr><th></th><th class="r">Trades</th><th class="r">Win %</th><th class="r">Net</th><th class="r">PF</th><th class="r">Per trade</th></tr></thead><tbody style="cursor:default">${rows}</tbody></table></div>`;
}
function equitySVG(list){
  if(list.length<2) return `<div class="hint">Equity curve shows after 2+ trades.</div>`;
  const W=900,H=220,P=34; let cum=0; const pts_=[0,...list.map(t=>cum+=t.net)];
  const mn=Math.min(0,...pts_), mx=Math.max(0,...pts_), span=(mx-mn)||1;
  const x=i=>P+(W-P-10)*i/(pts_.length-1), y=v=>10+(H-30)*(1-(v-mn)/span);
  const line=pts_.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join("");
  const area=line+`L${x(pts_.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  const last=pts_[pts_.length-1], col=last>=0?"#22c55e":"#ef4444";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
    <line x1="${P}" x2="${W-10}" y1="${y(0)}" y2="${y(0)}" stroke="#3a4450" stroke-dasharray="4 4"/>
    <path d="${area}" fill="${col}" opacity=".12"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2"/>
    <text x="2" y="${y(mx)+4}">${moneyShort(mx)}</text><text x="2" y="${y(mn)}">${moneyShort(mn)}</text>
    <text x="${P}" y="${H-4}">trade 1</text><text x="${W-60}" y="${H-4}">trade ${list.length}</text></svg>`;
}
function renderStats(m){
  const T=allEnriched();
  if(!T.length){ m.innerHTML=`<div class="empty card">No trades yet.</div>`; return; }
  const s=summary(T), st=S.settings;
  const be = isFinite(s.avgW)&&isFinite(s.avgL) ? s.avgL/(s.avgW+s.avgL)
           : (st.stopTicks*st.tickSize*st.pointValue+st.commission)/((st.targetTicks+st.stopTicks)*st.tickSize*st.pointValue);
  const [lo,hi]=wilson(s.w,s.w+s.l);
  let verdict, vcls;
  if(s.w+s.l<10){ verdict="Too few trades to tell yet"; vcls="mut"; }
  else if(lo>be){ verdict="Edge confirmed (95% confidence)"; vcls="pos"; }
  else if(hi<be){ verdict="Losing: win rate is below break-even"; vcls="neg"; }
  else { verdict="Looks positive, not proven yet"; vcls=""; }
  const days=new Set(T.map(t=>tday(t))); const perDay={}; T.forEach(t=>{const k=tday(t);perDay[k]=(perDay[k]||0)+1;});
  const maxDay=Math.max(...Object.values(perDay));
  // Target what-if using MFE (only trades that have it)
  const withMfe=T.filter(t=>t.mfePts!=null);
  let whatIf="";
  if(withMfe.length>=5){
    const rows=[]; const cur=withMfe.reduce((a,t)=>a+t.net,0);
    const maxTp=Math.floor(st.targetTicks*st.tickSize);
    for(let tp=4;tp<=maxTp;tp++){
      let net=0;
      withMfe.forEach(t=>{
        const pv=(t.pv||st.pointValue)*(t.qty||1), com=t.commission!=null?t.commission:st.commission*(t.qty||1);
        if(t.mfePts>=tp) net+=tp*pv-com;   // price reached it, so a target this size would have filled
        else net+=t.net;                   // otherwise the trade ends the same way it did
      });
      rows.push(`<tr><td class="num">${tp} pts</td><td class="r num ${cls(net)}">${money(net)}</td><td class="r num ${cls(net-cur)}">${money(net-cur)}</td></tr>`);
    }
    whatIf=`<div class="card"><h3>What if the target was smaller?</h3><p class="hint" style="margin-top:0">Uses each trade's max favorable move (MFE). ${withMfe.length} trades with MFE data. Actual: <b class="${cls(cur)}">${money(cur)}</b></p>
      <table><thead><tr><th>Target</th><th class="r">Would have made</th><th class="r">vs actual</th></tr></thead><tbody style="cursor:default">${rows.join("")}</tbody></table></div>`;
  }
  const nearStop=T.filter(t=>t.result==="Win"&&t.maePts!=null&&t.maePts>=st.stopTicks*st.tickSize-1).length;
  const nearTgt=T.filter(t=>t.result!=="Win"&&t.mfePts!=null&&t.mfePts>=st.targetTicks*st.tickSize-1).length;
  const hourKey=t=>t.noTime?null:(()=>{const h=t.date.getHours();const ap=h<12?"AM":"PM";return ((h%12)||12)+" "+ap;})();
  const atrKey=t=>t.atr==null||t.atr===""?null:t.atr<14?"Under 14":t.atr<16?"14–15.9":t.atr<18?"16–17.9":t.atr<=19?"18–19":"Over 19";
  m.innerHTML=propCard()+`<div class="grid kpis">
      <div class="card kpi"><div class="lab">Trades</div><div class="val num">${s.n}</div><div class="hint">${s.w}W · ${s.l}L · ${s.be} BE</div></div>
      <div class="card kpi"><div class="lab">Win rate</div><div class="val num">${pct(s.wr)}</div><div class="hint">break-even ${pct(be)}</div></div>
      <div class="card kpi"><div class="lab">Net P&amp;L</div><div class="val num ${cls(s.net)}">${money(s.net)}</div><div class="hint">${pts(s.pts)} pts</div></div>
      <div class="card kpi"><div class="lab">Profit factor</div><div class="val num">${isFinite(s.pf)?s.pf.toFixed(2):"–"}</div><div class="hint">gross ${money(s.gp)} / ${money(s.gl)}</div></div>
      <div class="card kpi"><div class="lab">Per trade</div><div class="val num ${cls(s.exp)}">${money(s.exp)}</div><div class="hint">avg win ${isFinite(s.avgW)?money(s.avgW):"–"} · loss ${isFinite(s.avgL)?money(s.avgL):"–"}</div></div>
      <div class="card kpi"><div class="lab">Trading days</div><div class="val num">${days.size}</div><div class="hint">max ${maxDay} trades in one day</div></div>
    </div>
    <div class="grid two" style="margin-top:14px">
      <div class="card"><h3>Is it an edge?</h3><div class="verdict ${vcls}">${verdict}</div>
        <div class="hint">Your real win rate is likely between <b>${pct(lo)}</b> and <b>${pct(hi)}</b> (95% range, ${s.w+s.l} decided trades). You need more than <b>${pct(be)}</b> to make money.</div>
        <div style="position:relative;margin-top:14px" class="bar"><i style="margin-left:${lo*100}%;width:${(hi-lo)*100}%;background:${lo>be?"#22c55e":hi<be?"#ef4444":"#f5b62b"}"></i></div>
        <div style="position:relative;height:16px"><span style="position:absolute;left:${be*100}%;transform:translateX(-50%);font-size:11px;color:#8b95a3">▲ break-even</span></div>
        ${maxDay/s.n>0.4&&s.n>=10?`<p class="hint" style="color:var(--gold)">${Math.round(maxDay/s.n*100)}% of your trades are from one day. Spread trades over more days for a fair test.</p>`:""}
      </div>
      <div class="card"><h3>Near misses</h3>
        <p style="margin:0 0 6px">Wins that came within 1 pt of the stop: <b>${nearStop}</b></p>
        <p style="margin:0 0 6px">Non-wins that got within 1 pt of the target: <b>${nearTgt}</b></p>
        <p class="hint" style="margin:0">From NinjaTrader's MAE / MFE, so only imported trades count.</p></div>
    </div>
    <div class="card" style="margin-top:14px"><h3>Equity curve</h3>${equitySVG(T)}</div>
    <div class="grid two" style="margin-top:14px">
      ${breakdown("By setup",T,t=>t.setup,OPTS.setup)}
      ${breakdown("By location in range",T,t=>t.loc,OPTS.loc)}
      ${breakdown("By meter reading",T,t=>t.meter,OPTS.meter)}
      ${breakdown("Followed meter?",T,t=>t.followed,OPTS.followed)}
      ${breakdown("By direction",T,t=>t.dir,OPTS.dir)}
      ${breakdown("By ATR at entry",T,atrKey,["Under 14","14–15.9","16–17.9","18–19","Over 19"])}
      ${breakdown("By exit",T,t=>t.outcome,OPTS.outcome)}
      ${breakdown("By hour (entry)",T,hourKey,["12 AM","1 AM","2 AM","3 AM","4 AM","5 AM","6 AM","7 AM","8 AM","9 AM","10 AM","11 AM","12 PM","1 PM","2 PM","3 PM","4 PM","5 PM","6 PM","7 PM","8 PM","9 PM","10 PM","11 PM"])}
      ${breakdown("By weekday",T,t=>t.date.toLocaleDateString("en-US",{weekday:"long"}),["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"])}
      ${whatIf}
    </div>
    <p class="hint">Groups need about 30 trades each before the numbers mean much.</p>`;
}

async function handleCsvFiles(files,boxSel="#impResult"){
  let added=0,dup=0,bad=0,merged=0,msgs=[],unl={},notes=[];
  const tvSel=$("#tvAcct"); const tvAcct=tvSel?tvSel.value:tvDefaultAcctId();
  for(const f of files){
    try{ const text=await f.text(); const head=parseCSV(text.split(/\r?\n/)[0]||"");
      const r=isTradovateRows(head)?importTradovateCSV(text,tvAcct):isTradovateOrders(head)?importTradovateOrders(text,tvAcct):importNinjaCSV(text);
      (r.notes||[]).forEach(n=>notes.push(n)); merged+=r.merged||0; await putMany(r.trades); r.trades.forEach(t=>{ const i=S.trades.findIndex(x=>x.id===t.id); if(i>=0) S.trades[i]=t; else S.trades.push(t); }); added+=r.trades.length-(r.merged||0); dup+=r.dup; bad+=r.bad; Object.entries(r.unlinked).forEach(([k,v])=>unl[k]=(unl[k]||0)+v); }
    catch(e){ msgs.push(f.name+": "+e.message); }
  }
  await reload();
  const out=`Imported <b>${added}</b> new trade${added===1?"":"s"}${merged?`, updated <b>${merged}</b> existing trade${merged===1?"":"s"} with the real fills / exit type (your tags kept)`:""}${dup?`, skipped ${dup} already in the journal`:""}${bad?`, ${bad} rows couldn't be read`:""}.` + (msgs.length?`<br><span class="neg">${esc(msgs.join(" | "))}</span>`:"")
    + (notes.length?`<br><span style="color:var(--gold)">${notes.map(esc).join("<br>")}</span>`:"")
    + (added?` Now tag them in <b>Trades</b> (filter: Needs tagging only).`:"")
    + (Object.keys(unl).length?`<br><span style="color:var(--gold)">NinjaTrader account ${Object.keys(unl).map(k=>"<b>"+esc(k)+"</b>").join(", ")} isn't linked to a journal account, so those trades went into <b>${esc(acctById(defaultAcctId()).name)}</b>. Link it in Settings → Accounts (NinjaTrader account name).</span>`:"");
  const box=$(boxSel); if(box) box.innerHTML=out;
  if(added||merged) toast(`Imported ${added} trades`+(merged?`, updated ${merged}`:""));
}

      t.pv=INSTRUMENTS[t.instrument]||acctById(t.accountId).pointValue;
    }
    await putTrade(t); close(); await reload(); toast("Saved");
  };
}
function viewImage(src){ const v=document.createElement("div"); v.className="viewer"; v.innerHTML=`<img src="${src}">`; v.onclick=()=>v.remove(); document.body.appendChild(v); }

// Backup / restore / CSV export
// ======================================================================
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b);});
function dataURLToBlob(u){ const [h,d]=u.split(","); const mime=(h.match(/data:(.*?);/)||[])[1]||"image/png"; const bin=atob(d); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return new Blob([a],{type:mime}); }
async function backup(){
  const trades=[]; for(const t of S.trades){ const imgs=[]; for(const i of t.images||[]) imgs.push({id:i.id,data:await blobToDataURL(i.blob)}); trades.push({...t,images:imgs}); }
  const out={app:"nq-trade-journal",version:2,saved:new Date().toISOString(),settings:S.settings,seedDone:S.seedDone,accounts:S.accounts,checkins:S.checkins,trades};
  download(`trade-journal-backup-${dayKey(new Date())}.json`,new Blob([JSON.stringify(out)],{type:"application/json"}));
  await kvSet("lastBackup",new Date().toISOString());
}
async function restore(file){
  if(!file) return;
  try{
    const j=JSON.parse(await file.text()); if(j.app!=="nq-trade-journal") throw new Error("Not a Trade Journal backup.");
    if(Array.isArray(j.accounts)){ j.accounts.forEach(a=>{ if(!S.accounts.some(x=>x.id===a.id)) S.accounts.push(a); }); await saveAccounts(); }
    const fallback=(S.accounts.find(a=>a.id==="acc-playback")||S.accounts[0]).id;
    const have=new Set(S.trades.map(t=>t.id)); let n=0;
    const list=j.trades.filter(t=>!have.has(t.id)).map(t=>{n++; return {...t,accountId:t.accountId||fallback,images:(t.images||[]).map(i=>({id:i.id,blob:dataURLToBlob(i.data)}))};});
    await putMany(list);
    if(j.settings){ S.settings={...DEFAULTS,...j.settings}; await kvSet("settings",S.settings); }
    if(j.seedDone){ S.seedDone=true; await kvSet("seedDone",true); }
    if(j.checkins){ S.checkins={...j.checkins,...S.checkins}; await kvSet("checkins",S.checkins); }
    await reload(); toast(`Restored ${n} trades`);
  }catch(e){ alert("Couldn't restore: "+e.message); }
}
function exportCSV(){
  const head=["Date","Time","Account","Contract","Direction","Qty","Points","Net","Result","Exit","Setup","Meter","Location","ATR","Followed meter","Behavior score",...EXEC.map(r=>r.label),"Max favorable pts","Max adverse pts","Notes","Link","Source"];
  const q=v=>{ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const rows=allEnriched().map(t=>[fmtDate(t.date),t.noTime?"":fmtTime(t.date),acctById(t.accountId).name,isImported(t)?t.instrument:(t.instrument||""),t.dir,t.qty||1,t.points.toFixed(2),t.net.toFixed(2),t.result,t.outcome,t.setup,t.meter,t.loc,t.atr??"",t.followed,behaviorScore(t)??"",...EXEC.map(r=>({y:"Yes",n:"No"})[(t.exec||{})[r.k]]||""),
    t.mfePts!=null?t.mfePts.toFixed(2):"",t.maePts!=null?t.maePts.toFixed(2):"",t.notes,t.link||"",srcName(t)].map(q).join(","));
  download(`trades-${dayKey(new Date())}.csv`,new Blob([[head.join(","),...rows].join("\n")],{type:"text/csv"}));
}

async function reload(){ S.trades=await getAll()||[]; render(); }
(async function init(){
  try{ db=await openDB(); }
  catch(e){ $("#main").innerHTML=`<div class="empty card">This browser blocked local storage, so the journal can't save. Open the file in Chrome or Edge.</div>`; return; }
  const st=await kvGet("settings"); if(st) S.settings={...DEFAULTS,...st};
  S.checkins=(await kvGet("checkins"))||{};
  if(S.settings.rollDays!==undefined||S.settings.edgeMin!==undefined){ S.settings.rollTrades=20; delete S.settings.rollDays; delete S.settings.edgeMin; await kvSet("settings",S.settings); }
  S.seedDone=!!(await kvGet("seedDone"));
  S.tvAcct=await kvGet("tvAcct");
  S.trades=await getAll()||[];
  S.accounts=(await kvGet("accounts"))||[];
  if(!S.accounts.length){ S.accounts=[{...DEFAULT_ACCOUNT}]; await kvSet("accounts",S.accounts); }
  // Trades from before accounts existed go into the Playback account
  const orphan=S.trades.filter(t=>!t.accountId||!S.accounts.some(a=>a.id===t.accountId));
  if(orphan.length){ const def=(S.accounts.find(a=>a.id==="acc-playback")||S.accounts[0]).id; orphan.forEach(t=>t.accountId=def); await putMany(orphan); }
  // First time on a new browser / empty journal: load the trades that came with this file
  if(!S.trades.length && !(await kvGet("preloadDone")) && PRELOAD && PRELOAD.trades){
    PRELOAD.accounts.forEach(pa=>{ if(!S.accounts.some(x=>x.id===pa.id)) S.accounts.push(pa); });
    await kvSet("accounts",S.accounts);
    const list=PRELOAD.trades.map(t=>({...t,images:(t.images||[]).map(i=>({id:i.id,blob:dataURLToBlob(i.data)}))}));
    await putMany(list); S.trades=list;
    await kvSet("seedDone",true); S.seedDone=true;
  }
  await kvSet("preloadDone",true);
  const savedAcct=await kvGet("acct"); S.acct=savedAcct==="all"||S.accounts.some(a=>a.id===savedAcct)?savedAcct:S.accounts[0].id;
  fillAcctSelect();
  $("#acctSel").onchange=async e=>{ S.acct=e.target.value; S.cal=null; S.dayFilter=null; await kvSet("acct",S.acct); fillAcctSelect(); render(); };
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{ if(b.dataset.v!=="log") S.dayFilter=null; setView(b.dataset.v); });
  $("#addBtn").onclick=()=>openEditor(null);
  $("#statusChip").onclick=()=>setView("edge");
  $("#backupBtn").onclick=backup;
  setView(S.trades.length?"calendar":"import");
})();

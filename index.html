<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dede's Practice Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: centered greeting, two equal doors (Trading | Chess) that stack on phones. Dark to match both apps. */
:root{
  --bg:#0b0d10; --panel:#13171c; --line:#262d36; --fg:#e6e9ee; --muted:#8b95a3;
  --trade:#22c55e; --trade-red:#ef4444; --chess:#eed5a4; --chess-dark:#355a31;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.hello{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,5vw,48px);line-height:1.08;margin:0;text-wrap:balance;font-weight:700}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:700px){.doors{grid-template-columns:minmax(0,1fr)}}
a.door{display:flex;flex-direction:column;gap:18px;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:24px;min-width:0}
@media (prefers-reduced-motion:no-preference){a.door{transition:transform .15s,border-color .15s}a.door:hover{transform:translateY(-3px)}}
a.door.trade:hover,a.door.trade:focus-visible{border-color:var(--trade)}
a.door.chess:hover,a.door.chess:focus-visible{border-color:var(--chess)}
a.door:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.art{height:150px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.trade .art{background:#0e1115;border:1px solid var(--line)}
.trade .art svg{width:100%;height:100%}
.chess .art{background:repeating-conic-gradient(var(--chess) 0 25%, var(--chess-dark) 0 50%) 0 0/50px 50px;position:relative}
.chess .art img{width:120px;height:120px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
h2{font-family:var(--display);font-size:28px;margin:0;line-height:1.1}
.door p{margin:0;color:var(--muted)}
.stat{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.stat b{color:var(--fg);font-weight:500}
.go{margin-top:auto;font-weight:600}
.hello{position:relative}
.syncbtn{position:absolute;right:0;top:-6px;font:600 13px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;cursor:pointer}
.syncbtn:hover{border-color:var(--muted)}
.syncbtn.on{border-color:#2f7d4f}
.trade .go{color:var(--trade)} .chess .go{color:var(--chess)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hello">
    <button class="syncbtn" id="syncBtn" onclick="window.HubSync && HubSync.openPanel()">☁ Sync</button>
    <div class="eyebrow" id="date"></div>
    <h1 id="greet">What would you like to work on today?</h1>
  </div>

            <!-- a ranging NQ session: wicks + bodies -->

          </g>
        </svg>
      </div>
      <div><h2>Trading</h2><p>Trade journal: calendar, trades, stats, edge and discipline.</p></div>
      <span class="go">Open journal →</span>
    </a>

    </a>

<script>
document.getElementById("date").textContent = new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
const h = new Date().getHours();
document.getElementById("greet").textContent = (h<12?"Good morning, Dede.":h<18?"Good afternoon, Dede.":"Good evening, Dede.") + " What would you like to work on today?";

// candlestick art: a seeded range-bound walk
(function(){
  const g = document.getElementById("candles"); let seed = 7, y = 75, out = "";
  const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  for(let i=0;i<22;i++){
    const x = 10 + i*13.2, o = y, c = Math.max(30, Math.min(120, y + (rnd()-0.5)*34 + (75-y)*0.25));
    const hi = Math.min(o,c) - rnd()*12, lo = Math.max(o,c) + rnd()*12, up = c < o;
    const col = up ? "#22c55e" : "#ef4444";
    out += `<line x1="${x+4}" x2="${x+4}" y1="${hi}" y2="${lo}" stroke="${col}"/>`;
    out += `<rect x="${x}" y="${Math.min(o,c)}" width="8" height="${Math.max(2,Math.abs(c-o))}" fill="${col}"/>`;
    y = c;
  }
  g.innerHTML = out;
})();

// today's chess progress, read from the puzzle trainer's saved data
(function(){
  const el = document.getElementById("chessStat");
  let S = {};
  try{ S = JSON.parse(localStorage.getItem("dailyPuzzleDrill.v1")) || {}; }catch(e){}
  const d = new Date(), t = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const sel0 = S.selected || ["rookEndgame","killBoxMate"], per = S.per || 20;
  const sel = S.day && S.day.date === t && S.day.random && !sel0.includes(S.day.random) ? [...sel0, S.day.random] : sel0;
  let done = 0, target = per * sel.length;
  if(S.day && S.day.date === t) for(const th of sel) done += Math.min(S.day.progress?.[th]?.done || 0, per);
  if(S.log && S.log[t]){ done = S.log[t].done; target = S.log[t].target; }   // the chess page's own count
  let streak = 0; const hist = S.history || {}; const c = new Date();
  const f = x => x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if(!hist[f(c)]) c.setDate(c.getDate()-1);
  while(hist[f(c)]){ streak++; c.setDate(c.getDate()-1); }
  const failed = Object.values(S.failed || {}).reduce((a,b)=>a+b.length,0);
  el.innerHTML = `<span>Today <b>${done}/${target}</b></span><span>Streak <b>${streak}</b></span>` + (failed ? `<span>To redo <b>${failed}</b></span>` : "");
})();
</script>
<script>
  // show whether sync is on
  (function(){ var b=document.getElementById('syncBtn'); if (window.HubSync && HubSync.connected()) { b.textContent='☁ Sync on'; b.classList.add('on'); } })();
</script>
